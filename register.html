<body>

<!-- ========== 注册页面主体 ========== -->

        <div class="visual-top">

      <div>
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-2 text-primary text-xs font-semibold mb-4">

      <form id="registerForm" class="space-y-5">
        <div class="grid sm:grid-cols-2 gap-4">
        <div class="form-group">
          <label for="username" class="block text-sm font-semibold text-body mb-2">用户名 <span class="text-red-500">*</span></label>
          <div class="input-wrapper relative">
            <span class="input-icon absolute left-3.5 top-1/2 -translate-y-1/2 text-muted">

            </span>
            <input type="text" id="username" name="username" placeholder="请输入用户名（4-20位字符）"

          </div>
          <p class="error-msg text-xs text-red-500 mt-1.5 hidden" id="usernameError">请输入用户名</p>
        </div>

        <div class="form-group">
          <label for="email" class="block text-sm font-semibold text-body mb-2">邮箱 <span class="text-xs font-normal text-muted">（选填）</span></label>
          <div class="input-wrapper relative">
            <span class="input-icon absolute left-3.5 top-1/2 -translate-y-1/2 text-muted">
              <span class="icon-mask w-5 h-5 text-muted" style="-webkit-mask-image:url('assets/icons/outline/mail.svg');mask-image:url('assets/icons/outline/mail.svg')"></span>
            </span>
            <input type="email" id="email" name="email" placeholder="请输入邮箱地址" 
              class="w-full pl-11 pr-4 py-3.5 border border-border rounded-xl text-sm text-body placeholder-muted focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all bg-white">
          </div>
          <p class="error-msg text-xs text-red-500 mt-1.5 hidden" id="emailError">请输入正确的邮箱地址</p>
        </div>
        </div>

        <div class="form-group">
          <label for="phone" class="block text-sm font-semibold text-body mb-2">手机号 <span class="text-red-500">*</span></label>
          <div class="input-wrapper relative">
            <span class="input-icon absolute left-3.5 top-1/2 -translate-y-1/2 text-muted">
              <span class="icon-mask w-5 h-5 text-muted" style="-webkit-mask-image:url('assets/icons/outline/phone.svg');mask-image:url('assets/icons/outline/phone.svg')"></span>
            </span>
            <input type="tel" id="phone" name="phone" placeholder="请输入手机号" maxlength="11"

          </div>
          <p class="error-msg text-xs text-red-500 mt-1.5 hidden" id="phoneError">请输入正确的手机号</p>
        </div>

        <div class="form-group">
          <label for="verifyCode" class="block text-sm font-semibold text-body mb-2">验证码 <span class="text-red-500">*</span></label>
          <div class="flex gap-3">
            <div class="input-wrapper relative flex-1">
              <span class="input-icon absolute left-3.5 top-1/2 -translate-y-1/2 text-muted">
                <span class="icon-mask w-5 h-5 text-muted" style="-webkit-mask-image:url('assets/icons/outline/shield-check.svg');mask-image:url('assets/icons/outline/shield-check.svg')"></span>
              </span>
              <input type="text" id="verifyCode" name="verifyCode" placeholder="请输入验证码" maxlength="6"

            </div>
            <button type="button" id="sendCodeBtn" class="px-5 py-3.5 bg-primary/10 text-primary hover:bg-primary/20 text-sm font-medium rounded-xl transition-colors whitespace-nowrap min-w-[120px]">
              获取验证码
            </button>
          </div>
          <p class="error-msg text-xs text-red-500 mt-1.5 hidden" id="verifyCodeError">请输入验证码</p>
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
        <div class="form-group">
          <label for="regPassword" class="block text-sm font-semibold text-body mb-2">设置密码 <span class="text-red-500">*</span></label>
          <div class="input-wrapper relative">
            <span class="input-icon absolute left-3.5 top-1/2 -translate-y-1/2 text-muted">
              <span class="icon-mask w-5 h-5 text-muted" style="-webkit-mask-image:url('assets/icons/outline/lock.svg');mask-image:url('assets/icons/outline/lock.svg')"></span>
            </span>
            <input type="password" id="regPassword" name="regPassword" placeholder="请输入密码（至少6位，包含字母和数字）"

            <button type="button" id="toggleRegPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-primary transition-colors p-1">
              <span class="icon-mask w-5 h-5" style="-webkit-mask-image:url('assets/icons/outline/eye.svg');mask-image:url('assets/icons/outline/eye.svg')" id="regEyeIcon"></span>
            </button>
          </div>
          <p class="error-msg text-xs text-red-500 mt-1.5 hidden" id="regPasswordError">密码长度不能少于6位</p>
          <div class="flex gap-1 mt-2" id="passwordStrength">
            <div class="strength-bar flex-1 h-1 rounded-full bg-border" data-level="1"></div>
            <div class="strength-bar flex-1 h-1 rounded-full bg-border" data-level="2"></div>
            <div class="strength-bar flex-1 h-1 rounded-full bg-border" data-level="3"></div>
          </div>
          <p class="text-xs text-muted mt-1" id="strengthText">密码强度：弱</p>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="block text-sm font-semibold text-body mb-2">确认密码 <span class="text-red-500">*</span></label>
          <div class="input-wrapper relative">
            <span class="input-icon absolute left-3.5 top-1/2 -translate-y-1/2 text-muted">
              <span class="icon-mask w-5 h-5 text-muted" style="-webkit-mask-image:url('assets/icons/outline/shield-check.svg');mask-image:url('assets/icons/outline/shield-check.svg')"></span>
            </span>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" 
              class="w-full pl-11 pr-11 py-3.5 border border-border rounded-xl text-sm text-body placeholder-muted focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all bg-white">
            <button type="button" id="toggleConfirmPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-primary transition-colors p-1">
              <span class="icon-mask w-5 h-5" style="-webkit-mask-image:url('assets/icons/outline/eye.svg');mask-image:url('assets/icons/outline/eye.svg')" id="confirmEyeIcon"></span>
            </button>
          </div>
          <p class="error-msg text-xs text-red-500 mt-1.5 hidden" id="confirmPasswordError">两次输入的密码不一致</p>
        </div>
        </div>

        <div class="flex items-start gap-2">
          <input type="checkbox" id="agreeTerms" class="w-4 h-4 mt-0.5 rounded border-border text-primary focus:ring-primary/20 cursor-pointer">
          <label for="agreeTerms" class="text-xs text-muted cursor-pointer leading-relaxed">
            我已阅读并同意
            <a href="javascript:void(0)" onclick="openPolicyModal('terms')" class="text-primary hover:underline">《用户协议》</a>
            和
            <a href="javascript:void(0)" onclick="openPolicyModal('privacy')" class="text-primary hover:underline">《隐私政策》</a>
          </label>
        </div>
        <p class="error-msg text-xs text-red-500 hidden" id="agreeError">请先同意用户协议和隐私政策</p>

        <button type="submit" id="registerBtn" class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-3.5 rounded-xl text-base transition-all shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 hover:-translate-y-0.5 relative overflow-hidden">
          <span class="btn-text">立即注册</span>
          <span class="btn-loading absolute inset-0 flex items-center justify-center hidden">
            <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
          </span>
          <span class="btn-success absolute inset-0 flex items-center justify-center hidden">
            <span class="icon-mask w-6 h-6 text-white" style="-webkit-mask-image:url('assets/icons/outline/check.svg');mask-image:url('assets/icons/outline/check.svg')"></span>
          </span>
        </button>
      </form>

      <div class="mt-8 text-center">
        <p class="text-sm text-muted">
          已有 xicel 账户？
          <a href="login.html" class="text-primary hover:text-primary-dark font-medium transition-colors">立即登录</a>
        </p>
      </div>
      </div>
      </div>
    </div>
  </div>
</section>

<script>
  function setupPasswordToggle(toggleId, inputId, iconId) {
    const toggle = document.getElementById(toggleId);
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    
    if (!toggle || !input || !icon) return;
    
    toggle.addEventListener('click', function() {
      const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
      input.setAttribute('type', type);
      
      if (type === 'text') {
        icon.style.webkitMaskImage = "url('assets/icons/outline/eye-off.svg')";
        icon.style.maskImage = "url('assets/icons/outline/eye-off.svg')";
      } else {
        icon.style.webkitMaskImage = "url('assets/icons/outline/eye.svg')";
        icon.style.maskImage = "url('assets/icons/outline/eye.svg')";
      }
    });
  }

  setupPasswordToggle('toggleRegPassword', 'regPassword', 'regEyeIcon');
  setupPasswordToggle('toggleConfirmPassword', 'confirmPassword', 'confirmEyeIcon');

  const registerForm = document.getElementById('registerForm');
  const registerBtn = document.getElementById('registerBtn');
  const btnText = registerBtn.querySelector('.btn-text');
  const btnLoading = registerBtn.querySelector('.btn-loading');
  const btnSuccess = registerBtn.querySelector('.btn-success');

  const usernameInput = document.getElementById('username');
  const emailInput = document.getElementById('email');
  const phoneInput = document.getElementById('phone');
  const verifyCodeInput = document.getElementById('verifyCode');
  const sendCodeBtn = document.getElementById('sendCodeBtn');
  const regPasswordInput = document.getElementById('regPassword');
  const confirmPasswordInput = document.getElementById('confirmPassword');
  const agreeTerms = document.getElementById('agreeTerms');

  const usernameError = document.getElementById('usernameError');
  const emailError = document.getElementById('emailError');
  const phoneError = document.getElementById('phoneError');
  const verifyCodeError = document.getElementById('verifyCodeError');
  const regPasswordError = document.getElementById('regPasswordError');
  const confirmPasswordError = document.getElementById('confirmPasswordError');
  const agreeError = document.getElementById('agreeError');

  let countdown = 0;
  let countdownTimer = null;

  function showError(input, errorEl, message) {
    input.classList.add('border-red-400', 'focus:ring-red-200', 'focus:border-red-400');
    input.classList.remove('border-border', 'focus:ring-primary/20', 'focus:border-primary');
    errorEl.textContent = message;
    errorEl.classList.remove('hidden');
  }

  function hideError(input, errorEl) {
    input.classList.remove('border-red-400', 'focus:ring-red-200', 'focus:border-red-400');
    input.classList.add('border-border', 'focus:ring-primary/20', 'focus:border-primary');
    errorEl.classList.add('hidden');
  }

  usernameInput.addEventListener('input', function() {
    if (this.value.trim().length >= 4) {
      hideError(this, usernameError);
    }
  });

  emailInput.addEventListener('input', function() {
    if (!this.value.trim()) {
      hideError(this, emailError);
      return;
    }
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (emailRegex.test(this.value.trim())) {
      hideError(this, emailError);
    }
  });

  phoneInput.addEventListener('input', function() {
    const phoneRegex = /^1[3-9]\d{9}$/;
    if (phoneRegex.test(this.value.trim())) {
      hideError(this, phoneError);
    }
  });

  verifyCodeInput.addEventListener('input', function() {
    if (this.value.trim().length >= 4) {
      hideError(this, verifyCodeError);
    }
  });

  sendCodeBtn.addEventListener('click', function() {
    if (countdown > 0) return;

    const phoneRegex = /^1[3-9]\d{9}$/;
    if (!phoneRegex.test(phoneInput.value.trim())) {
      showError(phoneInput, phoneError, '请输入正确的手机号');
      return;
    }

    countdown = 60;
    sendCodeBtn.disabled = true;
    sendCodeBtn.classList.add('bg-slate-100', 'text-muted', 'cursor-not-allowed');
    sendCodeBtn.classList.remove('bg-primary/10', 'text-primary', 'hover:bg-primary/20');

    updateCountdown();
    countdownTimer = setInterval(updateCountdown, 1000);
  });

  function updateCountdown() {
    if (countdown > 0) {
      sendCodeBtn.textContent = countdown + 's 后重发';
      countdown--;
    } else {
      clearInterval(countdownTimer);
      sendCodeBtn.textContent = '获取验证码';
      sendCodeBtn.disabled = false;
      sendCodeBtn.classList.remove('bg-slate-100', 'text-muted', 'cursor-not-allowed');
      sendCodeBtn.classList.add('bg-primary/10', 'text-primary', 'hover:bg-primary/20');
    }
  }

  function checkPasswordStrength(password) {
    let strength = 0;
    if (password.length >= 6) strength++;
    if (/[a-zA-Z]/.test(password) && /[0-9]/.test(password)) strength++;
    if (/[^a-zA-Z0-9]/.test(password) && password.length >= 8) strength++;
    return strength;
  }

  function updatePasswordStrength() {
    const password = regPasswordInput.value;
    const strength = checkPasswordStrength(password);
    const bars = document.querySelectorAll('.strength-bar');
    const strengthText = document.getElementById('strengthText');
    const colors = ['bg-red-400', 'bg-amber-400', 'bg-green-500'];
    const texts = ['弱', '中', '强'];
    const textColors = ['text-red-500', 'text-amber-500', 'text-green-600'];

    bars.forEach((bar, index) => {
      bar.className = 'strength-bar flex-1 h-1 rounded-full transition-colors';
      if (index < strength) {
        bar.classList.add(colors[strength - 1] || 'bg-border');
      } else {
        bar.classList.add('bg-border');
      }
    });

    if (password.length === 0) {
      strengthText.textContent = '密码强度：弱';
      strengthText.className = 'text-xs text-muted mt-1';
    } else {
      strengthText.textContent = '密码强度：' + (texts[strength - 1] || '弱');
      strengthText.className = 'text-xs mt-1 font-medium ' + (textColors[strength - 1] || 'text-muted');
    }
  }

  regPasswordInput.addEventListener('input', function() {
    updatePasswordStrength();
    if (this.value.length >= 6) {
      hideError(this, regPasswordError);
    }
    if (confirmPasswordInput.value && this.value === confirmPasswordInput.value) {
      hideError(confirmPasswordInput, confirmPasswordError);
    }
  });

  confirmPasswordInput.addEventListener('input', function() {
    if (this.value && this.value === regPasswordInput.value) {
      hideError(this, confirmPasswordError);
    }
  });

  agreeTerms.addEventListener('change', function() {
    if (this.checked) {
      agreeError.classList.add('hidden');
    }
  });

  registerForm.addEventListener('submit', function(e) {
    e.preventDefault();
    
    let isValid = true;
    
    if (!usernameInput.value.trim() || usernameInput.value.trim().length < 4) {
      showError(usernameInput, usernameError, '用户名至少4位字符');
      isValid = false;
    }
    
    const emailValue = emailInput.value.trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (emailValue && !emailRegex.test(emailValue)) {
      showError(emailInput, emailError, '请输入正确的邮箱地址');
      isValid = false;
    }
    
    const phoneRegex = /^1[3-9]\d{9}$/;
    if (!phoneRegex.test(phoneInput.value.trim())) {
      showError(phoneInput, phoneError, '请输入正确的手机号');
      isValid = false;
    }
    
    if (!verifyCodeInput.value.trim() || verifyCodeInput.value.trim().length < 4) {
      showError(verifyCodeInput, verifyCodeError, '请输入验证码');
      isValid = false;
    }
    
    if (!regPasswordInput.value || regPasswordInput.value.length < 6) {
      showError(regPasswordInput, regPasswordError, '密码长度不能少于6位');
      isValid = false;
    }
    
    if (!confirmPasswordInput.value || confirmPasswordInput.value !== regPasswordInput.value) {
      showError(confirmPasswordInput, confirmPasswordError, '两次输入的密码不一致');
      isValid = false;
    }
    
    if (!agreeTerms.checked) {
      agreeError.classList.remove('hidden');
      isValid = false;
    }
    
    if (!isValid) return;

    btnText.classList.add('opacity-0');
    btnLoading.classList.remove('hidden');
    registerBtn.disabled = true;

    setTimeout(function() {
      btnLoading.classList.add('hidden');
      btnSuccess.classList.remove('hidden');
      registerBtn.classList.remove('bg-primary', 'hover:bg-primary-dark');
      registerBtn.classList.add('bg-accent');

      setTimeout(function() {
        window.location.href = 'login.html';
      }, 1000);
    }, 1500);
  });
</script>

        <div><label class="block text-sm font-medium text-body mb-1.5">邮箱</label><input type="email" placeholder="请输入您的邮箱" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all text-sm"></div>
        <div><label class="block text-sm font-medium text-body mb-1.5">公司名称 <span class="text-red-400">*</span></label><input type="text" required placeholder="请输入您的公司名称" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all text-sm"></div>
        <div><label class="block text-sm font-medium text-body mb-1.5">需求描述</label><textarea rows="3" placeholder="请简要描述您的需求..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all text-sm resize-none"></textarea></div>
        <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-3.5 rounded-xl transition-all shadow-sm shadow-primary/20 hover:shadow-md hover:shadow-primary/30">提交咨询</button>
      </form>
    </div>
  </div>
</div>

<!-- 用户协议 / 隐私政策弹窗 -->
<div id="policyModal" class="fixed inset-0 z-[9999] flex items-center justify-center p-4" style="display:none;">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closePolicyModal()"></div>
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden">
    <div class="h-2 bg-gradient-to-r from-primary to-accent"></div>

      <div class="flex items-center justify-between mb-6">
        <h3 class="text-2xl font-bold text-body" id="policyModalTitle">用户协议</h3>

        </button>

      <div id="policyModalBody" class="max-h-[55vh] overflow-y-auto pr-2"></div>
      <div class="mt-8 text-center">

    </div>

<script>

function closeConsultModal(){ document.getElementById('consultModal').style.display='none'; unlockBodyScroll(); }
function submitConsult(e){ e.preventDefault(); alert('感谢您的咨询，我们将尽快联系您！'); closeConsultModal(); }


var policyContent = {
  terms: {

      { h: '一、服务说明', p: 'xicel 平台（以下简称"本平台"）为用户提供域名注册、云服务、品牌建设、知识产权服务等一站式数字化基建服务。用户在注册及使用本平台服务前，请仔细阅读本协议。' },
      { h: '二、账号注册与使用', p: '用户应提供真实、准确、完整的注册信息（包括手机号、用户名等），并妥善保管账号及密码。账号仅限注册用户本人使用，不得出借、转让或与他人共用。' },
      { h: '三、服务内容与费用', p: '本平台将按照各产品页面的说明提供对应服务。部分服务可能涉及费用，具体以下单页面的价格及计费规则为准，用户应在确认后完成支付。' },
      { h: '四、用户行为规范', p: '用户不得利用本平台从事任何违反法律法规、危害网络安全、侵犯他人合法权益的活动。因用户违规操作导致的后果由用户自行承担。' },
      { h: '五、知识产权', p: '本平台及相关服务所涉及的文字、图片、标识、界面设计、软件代码等知识产权均归 xicel 所有，未经书面许可，任何人不得擅自使用或转载。' },
      { h: '六、免责声明', p: '因不可抗力（如自然灾害、网络故障、政策调整等）导致服务中断或延迟的，本平台不承担责任，但将尽最大努力减少影响。' },
      { h: '七、协议变更与法律适用', p: '本平台有权根据业务需要更新本协议，更新后将在平台内公示。本协议适用中华人民共和国法律，因本协议产生的争议由平台所在地有管辖权的人民法院管辖。' }
    ]
  },
  privacy: {
    title: '隐私政策',
    sections: [
      { h: '一、信息收集', p: '在您注册、登录及使用本平台服务的过程中，我们可能会收集您的手机号、用户名、设备信息、操作日志及服务订单信息，以便为您提供稳定的服务。' },
      { h: '二、信息使用', p: '我们收集的信息将用于账号验证与安全保护、服务交付与质量改进、以及向您发送必要的服务通知。未经您的同意，我们不会将信息用于其他用途。' },
      { h: '三、信息共享', p: '除法律法规要求、司法机关或行政机关依法调取外，我们不会向任何第三方出售或提供您的个人信息。合作方仅在提供服务所必需的范围内接触信息。' },
      { h: '四、信息安全', p: '我们采用加密传输、访问控制、数据脱敏等技术和管理措施保护您的个人信息，防止信息被未经授权地访问、披露或篡改。' },
      { h: '五、您的权利', p: '您有权随时查询、更正或删除您的个人信息，或注销您的账号。您可以通过平台用户中心或联系我们行使上述权利。' },
      { h: '六、Cookie 与日志', p: '为改善访问体验，我们可能使用 Cookie 及服务日志记录您的浏览行为。您可以在浏览器中设置关闭 Cookie，但可能影响部分功能的正常使用。' },
      { h: '七、政策更新与联系', p: '本政策可能随业务发展进行更新，更新后将在平台内公示。如您对本政策有任何疑问，可通过页面底部联系方式与我们取得联系。' }
    ]
  }
};

function openPolicyModal(type) {
  var data = policyContent[type] || policyContent.terms;
  document.getElementById('policyModalTitle').textContent = data.title;
  var body = document.getElementById('policyModalBody');
  var html = '';
  for (var i = 0; i < data.sections.length; i++) {
    html += '<h4 class="text-sm font-semibold text-body mb-1">' + data.sections[i].h + '</h4>';
    html += '<p class="text-sm text-muted leading-relaxed mb-4">' + data.sections[i].p + '</p>';
  }
  body.innerHTML = html;
  document.getElementById('policyModal').style.display = 'flex';
  lockBodyScroll();
}

function closePolicyModal() {
  document.getElementById('policyModal').style.display = 'none';
  unlockBodyScroll();
}


</script>
