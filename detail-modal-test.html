<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>订单详情弹窗设计 - xicel</title>
<script src="js/tailwindcss.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
/* ===== Reset ===== */
*{box-sizing:border-box;}
body{background:#F2F4F6;padding-top:0;margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;color:#0F172A;-webkit-font-smoothing:antialiased;}
.wrap{max-width:760px;margin:0 auto;padding:32px 16px;}

/* ===== 顶部栏 ===== */
.top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
.style-tags{display:inline-flex;background:#E8ECF0;border-radius:10px;padding:3px;gap:2px;}
.style-tag{padding:6px 14px;font-size:12px;font-weight:600;color:#64748B;border-radius:7px;cursor:pointer;transition:all .2s;border:none;background:transparent;white-space:nowrap;}
.style-tag.active{background:#fff;color:#0A66FF;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.picker{display:flex;align-items:center;gap:6px;}
.picker label{font-size:12px;color:#64748B;}
.picker select{padding:6px 12px;border:1px solid #E2E8F0;border-radius:8px;font-size:12px;color:#0F172A;background:#fff;outline:none;cursor:pointer;max-width:200px;}
.style-hint{font-size:12px;color:#64748B;text-align:center;padding:6px 14px;background:#fff;border-radius:8px;border:1px solid #E8ECF0;margin-bottom:20px;}

/* ===== 弹窗容器 ===== */
.stage{
  background:#fff;border-radius:20px;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.03),0 8px 30px rgba(0,0,0,.05);
}
.stage-head{display:flex;align-items:center;justify-content:space-between;padding:20px 28px 16px;border-bottom:1px solid #F0F2F4;}
.stage-head h3{font-size:16px;font-weight:700;color:#0F172A;margin:0;}
.stage-head .close{width:32px;height:32px;border-radius:8px;border:none;background:#F2F4F6;color:#94A3B8;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stage-body{padding:24px 28px 28px;}

@media(max-width:640px){
  .wrap{padding:16px 8px;}
  .top-bar{flex-direction:column;align-items:stretch;}
  .style-tags{justify-content:center;}
  .picker{justify-content:center;}
  .stage-head{padding:14px 16px 12px;}
  .stage-head h3{font-size:14px;}
  .stage-body{padding:16px;}
}

/* ===== 模拟下拉 ===== */
.md{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border:1px solid #E2E8F0;border-radius:6px;background:#fff;font-size:12px;color:#0F172A;cursor:pointer;transition:border-color .15s;}
.md:hover{border-color:#94A3B8;}

/* ########## STYLE A — 极简精致 ########## */
.style-a .a-prod{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding:0;}
.style-a .a-prod .ap-ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px;}
.style-a .a-prod .ap-ico.dom{background:linear-gradient(135deg,#EFF6FF,#DBEAFE);}
.style-a .a-prod .ap-ico.cld{background:linear-gradient(135deg,#ECFDF5,#D1FAE5);}
.style-a .a-prod .ap-ico.ssl{background:linear-gradient(135deg,#FFFBEB,#FDE68A);}
.style-a .a-prod .ap-ico.mal{background:linear-gradient(135deg,#FDF2F8,#FCE7F3);}
.style-a .a-prod .ap-ico.oth{background:linear-gradient(135deg,#F1F5F9,#E2E8F0);}
.style-a .a-prod .ap-info{flex:1;min-width:0;}
.style-a .a-prod .ap-name{font-size:17px;font-weight:700;color:#0F172A;letter-spacing:-.3px;}
.style-a .a-prod .ap-type{font-size:13px;color:#94A3B8;margin-top:3px;}
.style-a .a-prod .ap-price{font-size:22px;font-weight:700;color:#0A66FF;letter-spacing:-.5px;white-space:nowrap;}
.style-a .a-sec{margin-bottom:22px;}
.style-a .a-sec:last-child{margin-bottom:0;}
.style-a .a-sec-label{font-size:11px;font-weight:600;color:#94A3B8;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:12px;}
.style-a .a-flex{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.style-a .a-flex .af{padding:9px 0;border-bottom:1px solid #F2F4F6;}
.style-a .a-flex .af .af-l{font-size:12px;color:#94A3B8;margin-bottom:2px;}
.style-a .a-flex .af .af-v{font-size:14px;font-weight:500;color:#0F172A;}
.style-a .a-flex .af:last-child:nth-child(odd){grid-column:1/-1;}
.style-a .a-reg{padding:14px 16px;background:#F8FAFC;border-radius:12px;}
.style-a .a-reg .ar-h{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.style-a .a-reg .ar-h .ar-l{font-size:12px;color:#64748B;}
.style-a .a-reg .ar-b{font-size:13px;color:#0F172A;line-height:1.7;}
.style-a .a-fee{padding:14px 16px;background:#F8FAFC;border-radius:12px;}
.style-a .a-fee .fee-r{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;color:#64748B;}
.style-a .a-fee .fee-t{border-top:1px solid #E2E8F0;margin-top:7px;padding-top:10px;}
.style-a .a-fee .fee-t .ft-l{font-size:14px;font-weight:700;color:#0F172A;}
.style-a .a-fee .fee-t .ft-r{font-size:22px;font-weight:800;color:#0A66FF;letter-spacing:-.5px;}

/* ########## STYLE B — 卡片叠层 ########## */
.style-b .b-crd{border:1px solid #E8ECF0;border-radius:14px;margin-bottom:14px;overflow:hidden;}
.style-b .b-crd:last-child{margin-bottom:0;}
.style-b .b-crd .bc-h{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#FAFBFC;border-bottom:1px solid #F0F2F4;}
.style-b .b-crd .bc-h .bc-t{font-size:12px;font-weight:600;color:#0F172A;}
.style-b .b-crd .bc-b{padding:14px 16px;}
.style-b .b-prod{display:flex;align-items:center;gap:12px;}
.style-b .b-prod .bp-ico{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;}
.style-b .b-prod .bp-ico.dom{background:#EFF6FF;}
.style-b .b-prod .bp-ico.cld{background:#ECFDF5;}
.style-b .b-prod .bp-ico.ssl{background:#FFFBEB;}
.style-b .b-prod .bp-ico.mal{background:#FDF2F8;}
.style-b .b-prod .bp-ico.oth{background:#F1F5F9;}
.style-b .b-prod .bp-info{flex:1;}
.style-b .b-prod .bp-name{font-size:14px;font-weight:600;color:#0F172A;}
.style-b .b-prod .bp-type{font-size:12px;color:#94A3B8;margin-top:2px;}
.style-b .b-prod .bp-price{font-size:18px;font-weight:700;color:#0A66FF;}
.style-b .b-ln{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13px;border-bottom:1px solid #F4F5F7;}
.style-b .b-ln:last-child{border-bottom:none;}
.style-b .b-ln .bl-l{color:#94A3B8;}
.style-b .b-ln .bl-v{color:#0F172A;font-weight:500;}
.style-b .b-reg{background:#F8FAFC;border-radius:10px;padding:12px 14px;}
.style-b .b-reg .br-h{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px;color:#64748B;}
.style-b .b-reg .br-b{font-size:12px;color:#0F172A;line-height:1.6;}

/* ########## STYLE C — 现代展示 ########## */
.style-c .c-sec{margin-bottom:26px;}
.style-c .c-sec:last-child{margin-bottom:0;}
.style-c .c-sec .cs-l{font-size:10px;font-weight:700;color:#0A66FF;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.style-c .c-sec .cs-l::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#E2E8F0,transparent);}
.style-c .c-prod{display:flex;align-items:center;gap:16px;padding:14px 18px;background:#F8FAFC;border-radius:14px;}
.style-c .c-prod .cp-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;color:#fff;}
.style-c .c-prod .cp-ico.dom{background:linear-gradient(135deg,#0A66FF,#3B82F6);}
.style-c .c-prod .cp-ico.cld{background:linear-gradient(135deg,#059669,#10B981);}
.style-c .c-prod .cp-ico.ssl{background:linear-gradient(135deg,#D97706,#F59E0B);}
.style-c .c-prod .cp-ico.mal{background:linear-gradient(135deg,#DB2777,#EC4899);}
.style-c .c-prod .cp-ico.oth{background:linear-gradient(135deg,#475569,#64748B);}
.style-c .c-prod .cp-info{flex:1;}
.style-c .c-prod .cp-name{font-size:17px;font-weight:700;color:#0F172A;}
.style-c .c-prod .cp-type{font-size:13px;color:#94A3B8;margin-top:3px;}
.style-c .c-prod .cp-price{font-size:24px;font-weight:800;color:#0A66FF;letter-spacing:-.5px;}
.style-c .c-ln{display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid #F2F4F6;}
.style-c .c-ln:last-child{border-bottom:none;}
.style-c .c-ln .cl-l{font-size:13px;color:#94A3B8;width:80px;flex-shrink:0;}
.style-c .c-ln .cl-v{font-size:14px;font-weight:500;color:#0F172A;}
.style-c .c-reg{padding:14px 18px;background:#FAFBFC;border-radius:12px;border:1px solid #E8ECF0;}
.style-c .c-reg .cr-h{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;color:#64748B;}
.style-c .c-reg .cr-b{font-size:13px;color:#0F172A;line-height:1.7;}
.style-c .c-fee{background:#FAFBFC;border-radius:12px;padding:14px 18px;border:1px solid #E8ECF0;}
.style-c .c-fee .cf-r{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;color:#64748B;}
.style-c .c-fee .cf-t{border-top:2px solid #0A66FF;margin-top:7px;padding-top:10px;}
.style-c .c-fee .cf-t .ct-l{font-size:15px;font-weight:700;color:#0F172A;}
.style-c .c-fee .cf-t .ct-r{font-size:26px;font-weight:800;color:#0A66FF;letter-spacing:-1px;}

/* ########## STYLE D — 企业订单 ########## */
.style-d .d-prod{display:flex;align-items:center;gap:14px;padding:16px;background:#F5F7FA;border-radius:12px;margin-bottom:20px;}
.style-d .d-prod .dp-ico{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;background:#fff;}
.style-d .d-prod .dp-ico.dom{background:#E6F4FF;color:#1677FF;}
.style-d .d-prod .dp-ico.cld{background:#E6FFF0;color:#059669;}
.style-d .d-prod .dp-ico.ssl{background:#FFFBE6;color:#D97706;}
.style-d .d-prod .dp-ico.mal{background:#FFF0F6;color:#DB2777;}
.style-d .d-prod .dp-ico.oth{background:#F0F0F5;color:#475569;}
.style-d .d-prod .dp-info{flex:1;min-width:0;}
.style-d .d-prod .dp-name{font-size:16px;font-weight:600;color:#1D2129;margin-bottom:2px;}
.style-d .d-prod .dp-type{font-size:12px;color:#86909C;}
.style-d .d-prod .dp-price{font-size:20px;font-weight:500;color:#1677FF;white-space:nowrap;}
.style-d .d-tags{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.style-d .d-tags .dt{display:inline-block;padding:2px 10px;font-size:12px;color:#1D2129;background:#fff;border:1px solid #D9D9D9;border-radius:6px;}
.style-d .d-order{margin-bottom:16px;}
.style-d .d-order .do-row{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px;border-bottom:1px solid #F5F5F5;}
.style-d .d-order .do-row:last-child{border-bottom:none;}
.style-d .d-order .do-row .do-l{color:#1D2129;flex-shrink:0;width:72px;}
.style-d .d-order .do-row .do-v{color:#1D2129;font-weight:500;text-align:left;}
.style-d .d-reg-select{margin-bottom:10px;display:flex;align-items:center;}
.style-d .d-reg{padding:14px 16px;background:#F5F7FA;border-radius:12px;margin-bottom:20px;}
.style-d .d-reg .dr-title{font-size:14px;font-weight:600;color:#1D2129;margin-bottom:10px;}
.style-d .d-reg .dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
.style-d .d-reg .dr-grid .dr-f .dr-fl{font-size:11px;color:#86909C;margin-bottom:2px;letter-spacing:.3px;}
.style-d .d-reg .dr-grid .dr-f .dr-fv{font-size:13px;color:#1D2129;font-weight:500;}
.style-d .d-fee{border-top:1px solid #F0F0F0;padding-top:14px;margin-bottom:20px;}
.style-d .d-fee .df-t{display:flex;justify-content:space-between;align-items:center;padding:6px 0;}
.style-d .d-fee .df-t .dt-l{font-size:16px;font-weight:600;color:#1D2129;}
.style-d .d-fee .df-t .dt-r{font-size:22px;font-weight:600;color:#1677FF;}
.style-d .d-btns{display:flex;gap:12px;}
.style-d .d-btns .db{flex:1;height:40px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;border:none;outline:none;}
.style-d .d-btns .db-pay{background:#1677FF;color:#fff;border:1px solid #1677FF;}
.style-d .d-btns .db-pay:hover{background:#0958D9;}
.style-d .d-btns .db-cancel{background:#fff;color:#1D2129;border:1px solid #D9D9D9;}
.style-d .d-btns .db-cancel:hover{background:#F5F5F5;border-color:#BFBFBF;}

/* ########## STYLE E — 简洁商务 ########## */
.style-e .e-head-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.style-e .e-head-row .eh-badge{display:inline-block;padding:3px 10px;font-size:12px;color:#1677FF;background:#E6F4FF;border-radius:16px;font-weight:500;}
.style-e .e-head-row .eh-id{font-size:13px;color:#86909C;font-family:monospace;}
.style-e .e-divider{height:1px;background:#F0F2F4;margin:16px 0;}
.style-e .e-prod{display:flex;align-items:center;gap:12px;margin-bottom:0;}
.style-e .e-prod .ep-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
.style-e .e-prod .ep-ico.dom{background:#E6F4FF;color:#1677FF;}
.style-e .e-prod .ep-ico.cld{background:#E6FFF0;color:#059669;}
.style-e .e-prod .ep-ico.ssl{background:#FFFBE6;color:#D97706;}
.style-e .e-prod .ep-ico.mal{background:#FFF0F6;color:#DB2777;}
.style-e .e-prod .ep-ico.oth{background:#F0F0F5;color:#475569;}
.style-e .e-prod .ep-info{flex:1;}
.style-e .e-prod .ep-name{font-size:15px;font-weight:600;color:#1D2129;}
.style-e .e-prod .ep-type{font-size:12px;color:#86909C;margin-top:1px;}
.style-e .e-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:0;}
.style-e .e-grid .eg{padding:10px 0;border-bottom:1px solid #F5F5F5;display:flex;flex-direction:column;}
.style-e .e-grid .eg .eg-l{font-size:12px;color:#86909C;margin-bottom:2px;}
.style-e .e-grid .eg .eg-v{font-size:14px;font-weight:500;color:#1D2129;}
.style-e .e-grid .eg:last-child:nth-child(odd){grid-column:1/-1;}
.style-e .e-reg{padding:12px 14px;background:#F8FAFC;border-radius:10px;margin-bottom:0;}
.style-e .e-reg .er-h{font-size:13px;font-weight:600;color:#1D2129;margin-bottom:8px;}
.style-e .e-reg .er-row{display:flex;gap:16px;flex-wrap:wrap;}
.style-e .e-reg .er-row .er-f{font-size:12px;color:#86909C;}
.style-e .e-reg .er-row .er-f span{color:#1D2129;}
.style-e .e-price-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 0 0;margin-bottom:0;}
.style-e .e-price-bar .epb-l{font-size:14px;color:#86909C;}
.style-e .e-price-bar .epb-r{font-size:20px;font-weight:700;color:#1677FF;}
.style-e .e-actions{display:flex;gap:12px;margin-top:16px;}
.style-e .e-actions .ea{flex:1;height:40px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;outline:none;}
.style-e .e-actions .ea-primary{background:#1677FF;color:#fff;}
.style-e .e-actions .ea-primary:hover{background:#0958D9;}
.style-e .e-actions .ea-secondary{background:#fff;color:#1D2129;border:1px solid #D9D9D9;}
.style-e .e-actions .ea-secondary:hover{background:#F5F5F5;}

/* ===== 响应式补丁 ===== */
@media(max-width:640px){
  .style-a .a-prod{flex-wrap:wrap;}
  .style-a .a-prod .ap-price{width:100%;text-align:right;}
  .style-a .a-flex{grid-template-columns:1fr;}
  .style-b .b-prod{flex-wrap:wrap;}
  .style-b .b-prod .bp-price{width:100%;text-align:right;}
  .style-c .c-prod{flex-wrap:wrap;}
  .style-c .c-prod .cp-price{width:100%;text-align:right;}
  .style-d .d-prod{flex-wrap:wrap;}
  .style-d .d-prod .dp-price{width:100%;text-align:right;}
  .style-d .d-reg .dr-grid{grid-template-columns:1fr;}
  .style-d .d-btns{flex-direction:column;}
  .style-e .e-grid{grid-template-columns:1fr;}
  .style-e .e-actions{flex-direction:column;}
}
</style>
<script>
tailwind.config={theme:{extend:{colors:{primary:'#0A66FF','primary-dark':'#0047CC',accent:'#00D4AA'}}}}
</script>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <div class="style-tags">
      <button class="style-tag active" data-s="a" onclick="pick('a')">A · 极简精致</button>
      <button class="style-tag" data-s="b" onclick="pick('b')">B · 卡片叠层</button>
      <button class="style-tag" data-s="c" onclick="pick('c')">C · 现代展示</button>
      <button class="style-tag" data-s="d" onclick="pick('d')">D · 企业订单</button>
      <button class="style-tag" data-s="e" onclick="pick('e')">E · 简洁商务</button>
    </div>
    <div class="picker">
      <label>商品</label>
      <select id="prodPicker" onchange="render()"></select>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="stage-head">
      <h3 id="modalTitle">商品详情</h3>
      <div class="close">
        <span class="icon-mask w-4 h-4 text-muted" style="-webkit-mask-image:url('assets/icons/outline/x.svg');mask-image:url('assets/icons/outline/x.svg')"></span>
      </div>
    </div>
    <div class="stage-body" id="stageBody"></div>
  </div>
</div>

<script>
// ===== 数据 =====
var PRODS=[
  {id:'dom',name:'example.com',type:'域名注册',cls:'dom',ico:'🌐',pr:'¥88.00',yr:'1 年',st:'待处理',reg:true},
  {id:'cld',name:'轻量云服务器-2核4G',type:'云服务器',cls:'cld',ico:'☁️',pr:'¥599.00',yr:'1 年',sp:'2核4G · 5M带宽',st:'运行中'},
  {id:'ssl',name:'DigiCert 通配符 SSL',type:'SSL证书',cls:'ssl',ico:'🔒',pr:'¥1,299.00',yr:'1 年',ct:'OV 通配符',st:'待签发'},
  {id:'mal',name:'企业邮箱专业版',type:'企业邮箱',cls:'mal',ico:'✉️',pr:'¥250.00',yr:'1 年',us:'5 账号',st:'已开通'},
  {id:'oth',name:'品牌卫士·基础版',type:'增值服务',cls:'oth',ico:'🛡️',pr:'¥399.00',yr:'1 年',st:'待激活'}
];
function e(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function dd(t){return'<span class="md">'+e(t)+'<span class="icon-mask w-2.5 h-2.5 text-body" style="-webkit-mask-image:url(\'assets/icons/outline/chevron-down.svg\');mask-image:url(\'assets/icons/outline/chevron-down.svg\')"></span>'+'</span>';}

// ===== A =====
function buildA(p){
  var sp='',rg='';
  if(p.sp)sp+='<div class="af"><div class="af-l">配置</div><div class="af-v">'+p.sp+'</div></div>';

var F={a:buildA,b:buildB,c:buildC,d:buildD,e:buildE};
var cur='a',curId='dom';
function render(){
  curId=document.getElementById('prodPicker').value;
  var p=PRODS.find(function(x){return x.id===curId;});
  document.getElementById('modalTitle').textContent=p.name+' · '+p.type;
  document.getElementById('stageBody').innerHTML=F[cur](p);
  document.getElementById('stage').className='stage style-'+cur;
}
function pick(s){
  cur=s;
  document.querySelectorAll('.style-tag').forEach(function(t){t.classList.remove('active');});
  document.querySelector('.style-tag[data-s="'+s+'"]').classList.add('active');
  render();
}
(function(){
  var s=document.getElementById('prodPicker');
  PRODS.forEach(function(p){var o=document.createElement('option');o.value=p.id;o.textContent=p.name;s.appendChild(o);});
  render();
})();
